{% extends "base.html" %}
{% block title %}Courses{% endblock %}
{% block content %}
<h1 class="mb-4">Available Courses</h1>
<div class="row">
{% for course in courses %}
<div class="col-md-6 mb-3"><div class="card"><div class="card-body">
<h3>{{ course.name }}</h3><p>{{ course.description }}</p>
<a class="btn btn-primary" href="{% url 'course_details' course.id %}">View Course & Exam</a>
</div></div></div>
{% empty %}<p>No courses yet. Add one from the admin site.</p>{% endfor %}
</div>
{% endblock %}
